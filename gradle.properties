# Gradle
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Fabric/Loom settings (https://fabricmc.net/develop)
minecraft_version=1.21.11
loader_version=0.20.1
loom_version=1.9-SNAPSHOT
fabric_api_version=0.141.6+1.21.11

# Mod metadata
mod_version=1.0.0
maven_group=com.donutsmp.deck
archives_base_name=donutdeck

# Java runtime configuration (Loom requires JVM 25, targets Minecraft 21)
java_runtime_version=25
java_home=/Library/Java/JavaVirtualMachines/jdk-25.jdk/Contents/Home

# DonutDeck API defaults - override in config.yml after installation
donutdeck.api.base.url=https://api.donutsmp.net
donutdeck.market.refresh.interval.seconds=60
donutdeck.broadcast.rate.limit.requests.per.minute=30

# OpSec/Privacy mode - enabled by default for safety
donutdeck.opsec.privacy.mode=true